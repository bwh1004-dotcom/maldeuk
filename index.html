<html lang="ko">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--card:#101620;--card2:#161e2c;--gold:#f0a500;--orange:#ff6b2b;--glow:#ffd060;--text:#f0e6d3;--muted:#7a6e58;--border:rgba(240,165,0,.18);--oj:#ff7eb3;--un:#5eb8ff;--pr:#7ed87e}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Nanum Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
    .moon{position:fixed;top:22px;left:22px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9dc,#f0a500 60%,#c07000);box-shadow:0 0 26px rgba(240,165,0,.45);z-index:1}
    .mtn{position:fixed;bottom:0;width:100%;z-index:0;pointer-events:none}
    .wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:20px 18px 48px;min-height:100vh}
    .screen{display:none;animation:up .32s ease both}
    .screen.active{display:block}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .char-em{font-size:60px;display:block;margin-bottom:6px;animation:float 2.8s ease-in-out infinite}
    .char-em.talk{animation:talk .42s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes talk{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
    .setup-top{text-align:center;padding:36px 0 20px}
    .logo-row{font-size:64px;display:flex;justify-content:center;gap:8px;margin-bottom:14px}
    .logo-row span{animation:float var(--d,3s) ease-in-out infinite;display:block;filter:drop-shadow(0 0 16px rgba(240,165,0,.5))}
    .app-title{font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(240,165,0,.4)}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.6px}
    .app-sub{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.7}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px}
    .card-label{font-family:'Black Han Sans',sans-serif;font-size:15px;color:var(--gold);margin-bottom:11px}
    input.field{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(240,165,0,.3);border-radius:13px;padding:14px 16px;color:var(--text);font-size:16px;font-family:'Nanum Gothic',sans-serif;outline:none}
    input.field:focus{border-color:var(--gold)}
    input.field::placeholder{color:rgba(120,110,88,.5)}
    .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.65}
    .hint a{color:var(--gold)}
    .btn-main{width:100%;background:linear-gradient(135deg,var(--orange),var(--gold));border:none;border-radius:17px;padding:18px;color:#1a0800;font-family:'Black Han Sans',sans-serif;font-size:20px;cursor:pointer;box-shadow:0 4px 22px rgba(240,165,0,.32)}
    .btn-main:active{opacity:.85}
    .btn-main:disabled{opacity:.4;pointer-events:none}
    .btn-back{background:none;border:1px solid rgba(240,165,0,.22);border-radius:11px;padding:8px 18px;color:var(--gold);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:'Nanum Gothic',sans-serif}
    .home-top{text-align:center;padding:22px 0 16px}
    .greeting{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--glow)}
    .greeting em{color:var(--orange);font-style:normal}
    .greeting-sub{font-size:13px;color:var(--muted);margin-top:5px}
    .sec-label{font-family:'Black Han Sans',sans-serif;font-size:13px;color:var(--muted);margin-bottom:11px}
    .char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .char-card{background:var(--card);border:2px solid rgba(240,165,0,.1);border-radius:18px;padding:14px 8px 12px;text-align:center;cursor:pointer;transition:all .2s}
    .char-card:active{transform:scale(.95)}
    .char-card.oj.on{border-color:var(--oj);background:rgba(255,126,179,.09);box-shadow:0 0 22px rgba(255,126,179,.28)}
    .char-card.un.on{border-color:var(--un);background:rgba(94,184,255,.09);box-shadow:0 0 22px rgba(94,184,255,.28)}
    .char-card.pr.on{border-color:var(--pr);background:rgba(126,216,126,.09);box-shadow:0 0 22px rgba(126,216,126,.28)}
    .char-name{font-family:'Black Han Sans',sans-serif;font-size:14px;margin-top:6px}
    .char-name.oj{color:var(--oj)}.char-name.un{color:var(--un)}.char-name.pr{color:var(--pr)}
    .char-region{font-size:10px;color:var(--muted);margin-top:2px}
    .char-mood{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
    .preview-card{background:var(--card2);border-radius:16px;padding:13px 16px;margin-bottom:14px;border:1px solid rgba(240,165,0,.12);font-size:13px;line-height:1.7;font-weight:700;text-align:center}
    .preview-label{font-size:10px;color:var(--muted);margin-bottom:5px}
    .cat-header{text-align:center;padding:10px 0 16px}
    .cat-char-label{font-family:'Black Han Sans',sans-serif;font-size:16px;margin-top:8px}
    .cat-char-label.oj{color:var(--oj)}.cat-char-label.un{color:var(--un)}.cat-char-label.pr{color:var(--pr)}
    .cat-list{display:flex;flex-direction:column;gap:8px}
    .cat-btn{background:var(--card);border:1px solid rgba(240,165,0,.1);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
    .cat-btn:active{background:rgba(240,165,0,.09);border-color:var(--gold)}
    .cat-em-icon{font-size:28px;width:34px;text-align:center;flex-shrink:0}
    .cat-name{font-family:'Black Han Sans',sans-serif;font-size:14px;color:var(--text)}
    .cat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .msg-wrap{text-align:center;padding:8px 0}
    .msg-char{font-size:90px;display:inline-block;filter:drop-shadow(0 0 26px rgba(240,165,0,.45));margin-bottom:4px}
    .msg-who{font-family:'Black Han Sans',sans-serif;font-size:14px;margin-bottom:10px}
    .msg-who.oj{color:var(--oj)}.msg-who.un{color:var(--un)}.msg-who.pr{color:var(--pr)}
    .loading{display:flex;justify-content:center;gap:7px;padding:20px}
    .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);animation:bdot .55s ease-in-out infinite}
    .dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
    @keyframes bdot{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-9px);opacity:1}}
    .bubble{background:var(--card2);border-radius:22px;padding:20px 18px;margin:6px 0 16px}
    .bubble.oj{border:1px solid rgba(255,126,179,.35)}.bubble.un{border:1px solid rgba(94,184,255,.35)}.bubble.pr{border:1px solid rgba(126,216,126,.35)}
    .msg-text{font-size:17px;line-height:1.82;font-weight:700;white-space:pre-wrap}
    .btn-speak{width:100%;border:none;border-radius:16px;padding:17px;color:#fff;font-family:'Black Han Sans',sans-serif;font-size:19px;cursor:pointer;margin-bottom:10px;background:linear-gradient(135deg,#c1121f,#e63946)}

    .btn-regen{width:100%;background:transparent;border:1px solid rgba(240,165,0,.25);border-radius:16px;padding:13px;color:var(--gold);font-family:'Black Han Sans',sans-serif;font-size:15px;cursor:pointer;margin-bottom:9px}

    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(16,22,32,.96);border:1px solid rgba(240,165,0,.35);border-radius:12px;padding:11px 22px;color:var(--text);font-size:13px;z-index:999;display:none;white-space:nowrap}
    .footer-brand{text-align:center;font-size:10px;color:rgba(122,110,88,.28);padding:16px 0 4px;letter-spacing:1px}
    .hidden{display:none!important}
  </style>
</head>

  {id:'shoes',em:'\uD83D\uDC9F',name:'\uC2E0\uBC1C \uC815\uB9AC\uD558\uAE30',sub:'\uC2E0\uBC1C\uC744 \uC548 \uCE58\uC6B0\uB824 \uD560 \uB54C'}
];
var CTX = {teeth:'\uC774\uB97C \uC548 \uB2EC\uC73C\uB824\uACE0 \uBC84\uD2F0\uACE0 \uC788\uB294',eat:'\uBC25\uC744 \uC548 \uBA39\uAC70\uB098 \uD3B8\uC2DD\uD558\uB294',sleep:'\uC790\uAE30 \uC2EB\uB2E4\uACE0 \uB52C\uB97C \uC4F0\uB294',lie:'\uAC70\uC9D3\uB9D0\uC744 \uD558\uAC70\uB098 \uD558\uB824\uB294',tidy:'\uC7A5\uB09C\uAC10 \uC815\uB9AC\uB97C \uAC70\uBD80\uD558\uB294',screen:'TV\uB098 \uC720\uD29C\uBE0C\uB97C \uACC4\uC18D \uBCF4\uB824\uB294',wash:'\uC190\uC744 \uC528\uAE30 \uC2EB\uC5B4\uD558\uB294',share:'\uCE5C\uAD6C\uB098 \uD615\uC81C\uC640 \uB2E4\uD22C\uAC70\uB098 \uC591\uBCF4 \uC548 \uD558\uB294',veg:'\uCC44\uC18C\uB97C \uACE8\uB77C\uB0B4\uAC70\uB098 \uC548 \uBA39\uC73C\uB824\uB294',shoes:'\uC2E0\uBC1C\uC744 \uC548 \uCE58\uC6B0\uB824\uB294'};

var S = {name:'',key:'',char:null,cat:null,speaking:false,msg:''};

(function init(){
  makeStars(); buildChars(); buildCats();
  try {
    var d = JSON.parse(localStorage.getItem('maldeuk_v3') || '{}');
    if (d.name && d.key) { S.name=d.name; S.key=d.key; setName(); show('s-home'); return; }
  } catch(e){}
  show('s-setup');
})();

function makeStars(){
  var c=document.getElementById('stars');
  for(var i=0;i<70;i++){
    var s=document.createElement('div'); s.className='star';
    s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*65)+'%;width:'+(1+Math.random()*2)+'px;height:'+(1+Math.random()*2)+'px;--d:'+(2+Math.random()*3)+'s;animation-delay:'+(Math.random()*3)+'s';
    c.appendChild(s);
  }
}

function buildChars(){
  var h='';
  for(var i=0;i<CHARS.length;i++){
    var c=CHARS[i];
    h+='<div class="char-card '+c.cls+'" id="cc-'+c.id+'" onclick="pickChar(\''+c.id+'\')">'
      +'<span style="font-size:52px;display:block;margin-bottom:6px">'+c.em+'</span>'
      +'<div class="char-name '+c.cls+'">'+c.name+'</div>'
      +'<div class="char-region">'+c.region+'</div>'
      +'<div class="char-mood">'+c.mood+'</div>'
      +'</div>';
  }
  document.getElementById('char-grid').innerHTML=h;
}

function buildCats(){
  var h='';
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    h+='<button class="cat-btn" onclick="pickCat(\''+c.id+'\')">'
      +'<span class="cat-em-icon">'+c.em+'</span>'
      +'<div style="flex:1"><div class="cat-name">'+c.name+'</div><div class="cat-sub">'+c.sub+'</div></div>'
      +'<span style="color:var(--muted);font-size:18px;margin-left:auto">\u203a</span>'
      +'</button>';
  }
  document.getElementById('cat-list').innerHTML=h;
}

function show(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++) ss[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function doSetup(){
  var name=document.getElementById('inp-name').value.trim()||'\uC544\uC774';
  var key=document.getElementById('inp-key').value.trim();
  S.name=name; S.key=key;
  save(); setName(); show('s-home');
}
function save(){ try{ localStorage.setItem('maldeuk_v3',JSON.stringify({name:S.name,key:S.key})); }catch(e){} }
function setName(){ document.getElementById('home-name').textContent=S.name; }

function pickChar(id){
  var cards=document.querySelectorAll('.char-card');
  for(var i=0;i<cards.length;i++) cards[i].classList.remove('on');
  document.getElementById('cc-'+id).classList.add('on');
  S.char=null;
  for(var i=0;i<CHARS.length;i++){ if(CHARS[i].id===id){ S.char=CHARS[i]; break; } }
  document.getElementById('preview-text').textContent='"'+(S.name)+'\uC544, '+S.char.preview+'"';
  document.getElementById('preview-card').classList.remove('hidden');
  document.getElementById('btn-next').disabled=false;
}

function goCategory(){
  if(!S.char) return;
  document.getElementById('cat-em').textContent=S.char.em;
  var lb=document.getElementById('cat-label');
  lb.textContent=S.char.name+'\uC774(\uAC00) \uB9D0\uD574\uC904\uAC8C\uC694!';
  lb.className='cat-char-label '+S.char.cls;
  show('s-cat');
}

function pickCat(id){
  S.cat=null;
  for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id){ S.cat=CATS[i]; break; } }
  show('s-msg'); generate();
}
function regen(){ stopSpeak(); generate(); }

function setChar(em, anim){
  var el=document.getElementById('msg-char');
  el.textContent=em;
  el.className='msg-char '+(anim||'float');
  el.style.animation = anim==='talk' ? 'talk .42s ease-in-out infinite' : 'float 2.8s ease-in-out infinite';
}

function generate(){
  var char=S.char, cat=S.cat, name=S.name, key=S.key;
  setChar(char.em,'float');
  var who=document.getElementById('msg-who');
  who.textContent=char.name+'\uC774(\uAC00) \uB9D0\uD574\uC904\uAC8C\uC694!';
  who.className='msg-who '+char.cls;
  g('loading',false); g('bubble',true); g('btn-speak',true); g('btn-regen',true);

  var prompt=char.persona+'\n\n\uC9C0\uAE08 "'+name+'"\uB77C\uB294 \uC544\uC774\uAC00 '+CTX[cat.id]+' \uC0C1\uD669\uC774\uC57C.\n'+name+'\uC774(\uAC00) \uC989\uC2DC \uD589\uB3D9\uC744 \uBC14\uAFC0 \uC218 \uC788\uB3C4\uB85D \uC9C1\uC811 \uB9D0\uD574\uC918.\n[\uADDC\uCE59] \uBC18\uB4DC\uC2DC "'+name+'" \uC774\uB984 1~2\uBC88 \uD3EC\uD568 / 2~3\uBB38\uC7A5 \uC9E7\uACE0 \uAC15\uB838\uD558\uAC8C / \uC0B4\uC9DD \uACA9\uB098\uBA74\uC11C\uB3C4 \uB530\uB73B\uD55C \uB290\uB099 / \uC0AC\uD22C\uB9AC \uB9D0\uD22C \uBC18\uB4DC\uC2DC \uC0AC\uC6A9 / \uB9C8\uC9C0\uB9C9 \uBB38\uC7A5\uC740 \uAD6C\uCCB4\uC801 \uD589\uB3D9 \uC9C0\uC2DC / \uB300\uC0AC\uB9CC \uCD9C\uB825';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error) throw new Error(d.error.message);
    S.msg=d.content[0].text.trim();
    g('loading',true);
    setChar(char.em,'float');
    document.getElementById('msg-text').textContent=S.msg;
    document.getElementById('bubble').className='bubble '+char.cls;
    g('bubble',false); g('btn-speak',false); g('btn-regen',false);
    setTimeout(function(){ speakNow(S.msg); },500);
  })
  .catch(function(e){
    g('loading',true);
    document.getElementById('msg-text').textContent='\u26A0\uFE0F \uC624\uB958: '+e.message+'\n\n\u2699\uFE0F \uC124\uC815\uC5D0\uC11C API \uD0A4\uB97C \uD655\uC778\uD574\uC8FC\uC138\uC694.';
    document.getElementById('bubble').className='bubble '+char.cls;
    g('bubble',false); g('btn-regen',false);
  });
}

function toggleSpeak(){ S.speaking ? stopSpeak() : speakNow(S.msg); }
function speakNow(text){
  if(!text) return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.pitch=S.char.pitch; u.rate=S.char.rate; u.volume=1;
  var vs=speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){ if(vs[i].lang.startsWith('ko')){ u.voice=vs[i]; break; } }
  u.onstart=function(){ S.speaking=true; var b=document.getElementById('btn-speak'); b.textContent='\u23F9 \uBA48\uCD94\uAE30'; b.classList.add('on'); setChar(S.char.em,'talk'); };
  u.onend=u.onerror=function(){ S.speaking=false; resetBtn(); };
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ window.speechSynthesis.cancel(); S.speaking=false; resetBtn(); }
function resetBtn(){
  var b=document.getElementById('btn-speak');
  if(b){ b.textContent='\uD83D\uDD0A \uBAA9\uC18C\uB9AC\uB85C \uC77D\uC5B4\uC8FC\uAE30'; b.classList.remove('on'); }
  if(S.char) setChar(S.char.em,'float');
}
function goHome(){
  stopSpeak(); S.char=null; S.cat=null;
  var cs=document.querySelectorAll('.char-card');
  for(var i=0;i<cs.length;i++) cs[i].classList.remove('on');
  document.getElementById('preview-card').classList.add('hidden');
  document.getElementById('btn-next').disabled=true;
  show('s-home');
}
function openSettings(){
  var n=prompt('\uC544\uC774 \uC774\uB984 \uBCC0\uACBD:',S.name);
  if(n!==null&&n.trim()) S.name=n.trim();
  var k=prompt('API \uD0A4 \uBCC0\uACBD (\uBCC0\uACBD \uC5C6\uC73C\uBA74 \uBE48\uCE78):','');
  if(k&&k.trim()) S.key=k.trim();
  save(); setName(); toast('\uC800\uC7A5\uB418\uC5C8\uC5B4\uC694! \u2705');
}
function g(id,hide){ document.getElementById(id).classList[hide?'add':'remove']('hidden'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2600); }
speechSynthesis.onvoiceschanged=function(){};
</script>
</body>
</html>
