<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>말듣 · UNODIYA 선생님</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080c14;--card:#101620;--card2:#161e2c;--gold:#f0a500;--orange:#ff6b2b;--glow:#ffd060;--text:#f0e6d3;--muted:#7a6e58;--border:rgba(240,165,0,.18);--oj:#ff7eb3;--un:#5eb8ff;--pr:#7ed87e}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Nanum Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
    .moon{position:fixed;top:22px;left:22px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9dc,#f0a500 60%,#c07000);box-shadow:0 0 26px rgba(240,165,0,.45);z-index:1}
    .mtn{position:fixed;bottom:0;width:100%;z-index:0;pointer-events:none}
    .wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:20px 18px 48px;min-height:100vh}
    .screen{display:none;animation:up .32s ease both}
    .screen.active{display:block}
    @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .sp{display:inline-block;background-repeat:no-repeat;background-size:304px 202px;width:76px;height:101px}
    .sp-lg{display:inline-block;background-repeat:no-repeat;background-size:460px 306px;width:115px;height:153px}
    .p0{background-position:0 0}.p1{background-position:-76px 0}.p2{background-position:-152px 0}.p3{background-position:-228px 0}
    .p4{background-position:0 -101px}.p5{background-position:-76px -101px}.p6{background-position:-152px -101px}.p7{background-position:-228px -101px}
    .sp-lg.p0{background-position:0 0}.sp-lg.p1{background-position:-115px 0}.sp-lg.p2{background-position:-230px 0}.sp-lg.p3{background-position:-345px 0}
    .sp-lg.p4{background-position:0 -153px}.sp-lg.p5{background-position:-115px -153px}.sp-lg.p6{background-position:-230px -153px}.sp-lg.p7{background-position:-345px -153px}
    .a-float{animation:afloat 2.8s ease-in-out infinite}
    .a-talk{animation:atalk .42s ease-in-out infinite}
    .a-bounce{animation:abounce .6s ease-in-out infinite}
    @keyframes afloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes atalk{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-6deg) scale(1.06)}75%{transform:rotate(6deg) scale(1.06)}}
    @keyframes abounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .setup-top{text-align:center;padding:36px 0 20px}
    .logo-row{display:flex;justify-content:center;gap:8px;margin-bottom:14px;align-items:flex-end}
    .app-title{font-family:'Black Han Sans',sans-serif;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(240,165,0,.4)}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.6px}
    .app-sub{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.7}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px}
    .card-label{font-family:'Black Han Sans',sans-serif;font-size:15px;color:var(--gold);margin-bottom:11px}
    input.field{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(240,165,0,.3);border-radius:13px;padding:14px 16px;color:var(--text);font-size:16px;font-family:'Nanum Gothic',sans-serif;outline:none}
    input.field:focus{border-color:var(--gold)}
    input.field::placeholder{color:rgba(120,110,88,.5)}
    .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.65}
    .hint a{color:var(--gold)}
    .btn-main{width:100%;background:linear-gradient(135deg,var(--orange),var(--gold));border:none;border-radius:17px;padding:18px;color:#1a0800;font-family:'Black Han Sans',sans-serif;font-size:20px;cursor:pointer;box-shadow:0 4px 22px rgba(240,165,0,.32);transition:transform .1s}
    .btn-main:active{transform:scale(.97)}
    .btn-main:disabled{opacity:.4;pointer-events:none}
    .btn-back{background:none;border:1px solid rgba(240,165,0,.22);border-radius:11px;padding:8px 18px;color:var(--gold);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:'Nanum Gothic',sans-serif}
    .home-top{text-align:center;padding:22px 0 16px}
    .greeting{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--glow)}
    .greeting em{color:var(--orange);font-style:normal}
    .greeting-sub{font-size:13px;color:var(--muted);margin-top:5px}
    .sec-label{font-family:'Black Han Sans',sans-serif;font-size:13px;color:var(--muted);margin-bottom:11px}
    .char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .char-card{background:var(--card);border:2px solid rgba(240,165,0,.1);border-radius:18px;padding:14px 8px 12px;text-align:center;cursor:pointer;transition:all .2s;user-select:none}
    .char-card:active{transform:scale(.95)}
    .char-card.oj.on{border-color:var(--oj);background:rgba(255,126,179,.09);box-shadow:0 0 22px rgba(255,126,179,.28)}
    .char-card.un.on{border-color:var(--un);background:rgba(94,184,255,.09);box-shadow:0 0 22px rgba(94,184,255,.28)}
    .char-card.pr.on{border-color:var(--pr);background:rgba(126,216,126,.09);box-shadow:0 0 22px rgba(126,216,126,.28)}
    .char-name{font-family:'Black Han Sans',sans-serif;font-size:14px;margin-top:7px}
    .char-name.oj{color:var(--oj)}.char-name.un{color:var(--un)}.char-name.pr{color:var(--pr)}
    .char-region{font-size:10px;color:var(--muted);margin-top:2px}
    .char-mood{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
    .preview-card{background:var(--card2);border-radius:16px;padding:13px 16px;margin-bottom:14px;border:1px solid rgba(240,165,0,.12);font-size:13px;line-height:1.7;font-weight:700;text-align:center}
    .preview-label{font-size:10px;color:var(--muted);margin-bottom:5px}
    .cat-header{text-align:center;padding:10px 0 16px}
    .cat-char-label{font-family:'Black Han Sans',sans-serif;font-size:16px;margin-top:8px}
    .cat-char-label.oj{color:var(--oj)}.cat-char-label.un{color:var(--un)}.cat-char-label.pr{color:var(--pr)}
    .cat-list{display:flex;flex-direction:column;gap:8px}
    .cat-btn{background:var(--card);border:1px solid rgba(240,165,0,.1);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%;transition:all .14s}
    .cat-btn:active{background:rgba(240,165,0,.09);border-color:var(--gold);transform:scale(.98)}
    .cat-em{font-size:28px;width:34px;text-align:center;flex-shrink:0}
    .cat-name{font-family:'Black Han Sans',sans-serif;font-size:14px;color:var(--text)}
    .cat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .msg-wrap{text-align:center;padding:8px 0}
    .msg-sp-wrap{display:inline-block;margin-bottom:6px}
    .msg-who{font-family:'Black Han Sans',sans-serif;font-size:14px;margin-bottom:10px}
    .msg-who.oj{color:var(--oj)}.msg-who.un{color:var(--un)}.msg-who.pr{color:var(--pr)}
    .loading{display:flex;justify-content:center;gap:7px;padding:20px}
    .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);animation:bdot .55s ease-in-out infinite}
    .dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
    @keyframes bdot{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-9px);opacity:1}}
    .bubble{background:var(--card2);border-radius:22px;padding:20px 18px;margin:6px 0 16px}
    .bubble.oj{border:1px solid rgba(255,126,179,.35)}.bubble.un{border:1px solid rgba(94,184,255,.35)}.bubble.pr{border:1px solid rgba(126,216,126,.35)}
    .msg-text{font-size:17px;line-height:1.82;font-weight:700;white-space:pre-wrap}
    .btn-speak{width:100%;border:none;border-radius:16px;padding:17px;color:#fff;font-family:'Black Han Sans',sans-serif;font-size:19px;cursor:pointer;margin-bottom:10px;background:linear-gradient(135deg,#c1121f,#e63946);box-shadow:0 4px 18px rgba(230,57,70,.35);transition:transform .1s}
    .btn-speak.on{background:linear-gradient(135deg,#2d8659,#4caf87);animation:spulse 1.1s ease-in-out infinite}
    @keyframes spulse{0%,100%{box-shadow:0 4px 18px rgba(76,175,135,.4)}50%{box-shadow:0 4px 36px rgba(76,175,135,.8)}}
    .btn-speak:active{transform:scale(.97)}
    .btn-regen{width:100%;background:transparent;border:1px solid rgba(240,165,0,.25);border-radius:16px;padding:13px;color:var(--gold);font-family:'Black Han Sans',sans-serif;font-size:15px;cursor:pointer;margin-bottom:9px}
    .btn-regen:active{background:rgba(240,165,0,.08)}
    .btn-home{width:100%;background:none;border:none;padding:11px;color:var(--muted);font-size:13px;cursor:pointer;font-family:'Nanum Gothic',sans-serif}
    .gear-btn{position:fixed;top:14px;right:14px;z-index:100;background:rgba(16,22,32,.88);border:1px solid rgba(240,165,0,.2);border-radius:11px;padding:9px 13px;color:var(--muted);font-size:17px;cursor:pointer;backdrop-filter:blur(12px)}
    .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(16,22,32,.96);border:1px solid rgba(240,165,0,.35);border-radius:12px;padding:11px 22px;color:var(--text);font-size:13px;z-index:999;display:none;white-space:nowrap}
    .footer-brand{text-align:center;font-size:10px;color:rgba(122,110,88,.28);padding:16px 0 4px;letter-spacing:1px}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div id="stars"></div>
<div class="moon"></div>
<svg class="mtn" viewBox="0 0 480 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,120 L0,78 L50,40 L90,58 L140,16 L190,54 L230,30 L280,64 L330,24 L380,58 L420,34 L480,52 L480,120 Z" fill="rgba(8,12,20,.95)"/>
  <path d="M0,120 L0,95 L40,76 L80,88 L120,70 L165,82 L205,72 L255,92 L305,78 L355,88 L400,74 L450,84 L480,78 L480,120 Z" fill="rgba(16,22,32,.88)"/>
</svg>
<button class="gear-btn" onclick="openSettings()">⚙️</button>
<div class="toast" id="toast"></div>
<div class="wrap">
  <div class="screen active" id="s-setup">
    <div class="setup-top">
      <div class="logo-row" id="logo-row"></div>
      <div class="app-title">말듣 · UNODIYA 선생님</div>
      <div class="brand-sub">by UNODIYA · @uno_deya</div>
      <div class="app-sub">오짱·우노짱·푸른이가<br>우리 아이에게 직접 말해줘요 💬</div>
    </div>
    <div class="card">
      <div class="card-label">👶 우리 아이 이름은?</div>
      <input class="field" id="inp-name" type="text" placeholder="예: 하은, 지우, 민준..." maxlength="6">
    </div>
    <div class="card">
      <div class="card-label">🔑 Claude API 키</div>
      <input class="field" id="inp-key" type="password" placeholder="sk-ant-api03-...">
      <div class="hint">💡 <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> 에서 발급<br>키는 이 기기에만 저장되며 외부로 전송되지 않아요.</div>
    </div>
    <button class="btn-main" onclick="doSetup()">🌟 시작하기!</button>
    <div class="footer-brand">UNODIYA · maldeuk · unodeya.tistory.com</div>
  </div>
  <div class="screen" id="s-home">
    <div class="home-top">
      <div class="greeting">👶 <em id="home-name"></em>, 말 안 들을 때!</div>
      <div class="greeting-sub">누가 말해줄까요?</div>
    </div>
    <div class="sec-label">👋 캐릭터 선택</div>
    <div class="char-grid" id="char-grid"></div>
    <div class="preview-card hidden" id="preview-card">
      <div class="preview-label">이런 말투예요 😄</div>
      <div id="preview-text"></div>
    </div>
    <button class="btn-main" id="btn-next" disabled onclick="goCategory()">다음 → 상황 선택 ›</button>
    <div class="footer-brand" style="padding-top:14px">UNODIYA</div>
  </div>
  <div class="screen" id="s-cat">
    <button class="btn-back" onclick="show('s-home')">← 뒤로</button>
    <div class="cat-header">
      <div id="cat-char-wrap"></div>
      <div class="cat-char-label" id="cat-label"></div>
    </div>
    <div class="sec-label">📌 어떤 상황인가요?</div>
    <div class="cat-list" id="cat-list"></div>
  </div>
  <div class="screen" id="s-msg">
    <button class="btn-back" onclick="stopSpeak();show('s-cat')">← 다른 상황</button>
    <div class="msg-wrap">
      <div class="msg-sp-wrap" id="msg-sp-wrap"></div>
      <div class="msg-who" id="msg-who"></div>
      <div class="loading hidden" id="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="bubble hidden" id="bubble"><div class="msg-text" id="msg-text"></div></div>
      <button class="btn-speak hidden" id="btn-speak" onclick="toggleSpeak()">🔊 목소리로 읽어주기</button>
      <button class="btn-regen hidden" id="btn-regen" onclick="regen()">🔄 다른 말로 다시 생성</button>
      <button class="btn-home" onclick="goHome()">🏠 처음으로</button>
    </div>
  </div>
</div>

  {id:'oj',cls:'oj',name:'오짱',region:'순천 출신',mood:'따뜻하지만\n단호한 엄마 스타일',imgCls:'oj-img',pitch:1.12,rate:.82,
   preview:'오짱이 다 보고 있당께~ 얼른 안 하믄 혼날 줄 알아잉!',
   persona:'너는 전라남도 순천 출신의 따뜻하지만 단호한 오짱이야. 전라도 말투를 자연스럽게 사용해: "~잉","~당께","~소","~랑께" 같은 사투리. 자신을 "오짱이" 또는 "오짱"으로 지칭해.'},
  {id:'un',cls:'un',name:'우노짱',region:'부산 출신',mood:'직설적이고\n시원시원한 아빠 스타일',imgCls:'un-img',pitch:.7,rate:.86,
   preview:'우노짱이 쪽팔리게 왜 이라노! 얼른 해뿌라!',
   persona:'너는 부산 출신의 직설적이고 시원시원한 우노짱이야. 부산·경상도 말투를 자연스럽게 사용해: "~데이","~해뿌라","이라노","~아이가" 같은 사투리. 자신을 "우노짱이" 또는 "우노짱"으로 지칭해.'},
  {id:'pr',cls:'pr',name:'푸른이',region:'광주 출신',mood:'정겹고 유머 넘치는\n광주 친구 스타일',imgCls:null,em:'🌿',pitch:1.04,rate:.88,
   preview:'푸른이가 말하는디 안 들으믄 쓰겄어? 어서 혀봐~',
   persona:'너는 광주 출신의 정겹고 유머 있는 푸른이야. 광주·전라도 말투: "~혀","~쓰겄어","~하는디","~잖여" 사용. 자신을 "푸른이"로 지칭해.'}
];

var CATS = [
  {id:'teeth',em:'🦷',name:'양치질 하기',sub:'이를 안 닦으려 할 때'},
  {id:'eat',em:'🍚',name:'밥 먹기',sub:'안 먹거나 편식할 때'},
  {id:'sleep',em:'🌙',name:'잠자리 들기',sub:'자기 싫다고 떼쓸 때'},
  {id:'lie',em:'🤥',name:'거짓말하면 안 돼',sub:'거짓말을 하거나 하려 할 때'},
  {id:'tidy',em:'🧹',name:'장난감 정리하기',sub:'정리를 안 하려 할 때'},
  {id:'screen',em:'📱',name:'TV·유튜브 그만보기',sub:'화면을 계속 보려 할 때'},
  {id:'wash',em:'🧼',name:'손 씻기',sub:'손 씻기 싫다고 할 때'},
  {id:'share',em:'🤝',name:'사이좋게 지내기',sub:'친구·형제와 다툴 때'},
  {id:'veg',em:'🥦',name:'채소 먹기',sub:'채소를 골라내려 할 때'},
  {id:'shoes',em:'👟',name:'신발 정리하기',sub:'신발을 안 치우려 할 때'}
];

var CTX = {teeth:'이를 안 닦으려고 버티고 있는',eat:'밥을 안 먹거나 편식하는',sleep:'자기 싫다고 떼를 쓰는',lie:'거짓말을 하거나 하려는',tidy:'장난감 정리를 거부하는',screen:'TV나 유튜브를 계속 보려는',wash:'손을 씻기 싫어하는',share:'친구나 형제와 다투거나 양보 안 하는',veg:'채소를 골라내거나 안 먹으려는',shoes:'신발을 안 치우려는'};

var S = {name:'',key:'',char:null,cat:null,speaking:false,msg:''};

(function init(){
  makeStars(); buildChars(); buildCats();
  try {
    var d = JSON.parse(localStorage.getItem('maldeuk_v3') || '{}');
    if (d.name && d.key) { S.name=d.name; S.key=d.key; setName(); show('s-home'); return; }
  } catch(e) {}
  show('s-setup');
})();

function makeStars(){
  var c=document.getElementById('stars');
  for(var i=0;i<80;i++){
    var s=document.createElement('div'); s.className='star';
    s.style.cssText='left:'+rnd(100)+'%;top:'+rnd(65)+'%;width:'+(1+rnd(2))+'px;height:'+(1+rnd(2))+'px;--d:'+(2+rnd(3))+'s;animation-delay:'+rnd(3)+'s';
    c.appendChild(s);
  }
}
function rnd(n){ return Math.random()*n; }

function spSmall(c, pose){
  if (!c.imgCls) return '<div style="font-size:52px;margin-bottom:4px">'+c.em+'</div>';
  return '<div class="sp sp-'+c.id+' p'+pose+'"></div>';
}
function spLg(c, pose, anim){
  anim = anim || '';
  if (!c.imgCls) return '<div style="font-size:90px;display:inline-block;'+(anim?'animation:afloat 2.8s ease-in-out infinite;':'')+' filter:drop-shadow(0 0 22px rgba(126,216,126,.5))">'+c.em+'</div>';
  return '<div class="sp-lg '+c.imgCls+' sp-lg-p'+pose+' '+anim+'" style="filter:drop-shadow(0 4px 22px rgba(240,165,0,.4))"></div>';
}

function buildChars(){
  var html = '';
  for (var i=0; i<CHARS.length; i++){
    var c = CHARS[i];
    html += '<div class="char-card '+c.cls+'" id="cc-'+c.id+'" onclick="pickChar(''+c.id+'')">'
      + spSmall(c, 0)
      + '<div class="char-name '+c.cls+'">'+c.name+'</div>'
      + '<div class="char-region">'+c.region+'</div>'
      + '<div class="char-mood">'+c.mood+'</div>'
      + '</div>';
  }
  document.getElementById('char-grid').innerHTML = html;

  // sp-lg 포즈용 CSS 동적 생성
  var lgStyle = '';
  for (var p=0; p<8; p++){
    var col = p % 4;
    var row = Math.floor(p / 4);
    lgStyle += '.sp-lg-p'+p+'{background-position:'+(-115*col)+'px '+(-153*row)+'px}';
  }
  var st = document.createElement('style');
  st.textContent = lgStyle;
  document.head.appendChild(st);
}

function buildCats(){
  var html = '';
  for (var i=0; i<CATS.length; i++){
    var c = CATS[i];
    html += '<button class="cat-btn" onclick="pickCat(''+c.id+'')">'
      + '<span class="cat-em">'+c.em+'</span>'
      + '<div style="flex:1"><div class="cat-name">'+c.name+'</div><div class="cat-sub">'+c.sub+'</div></div>'
      + '<span style="color:var(--muted);font-size:18px;margin-left:auto">›</span>'
      + '</button>';
  }
  document.getElementById('cat-list').innerHTML = html;
}

function show(id){
  var screens = document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function doSetup(){
  var name = document.getElementById('inp-name').value.trim() || '아이';
  var key = document.getElementById('inp-key').value.trim();
  S.name = name; S.key = key;
  save(); setName(); show('s-home');
}

function save(){ localStorage.setItem('maldeuk_v3', JSON.stringify({name:S.name, key:S.key})); }
function setName(){ document.getElementById('home-name').textContent = S.name; }

function pickChar(id){
  var cards = document.querySelectorAll('.char-card');
  for(var i=0;i<cards.length;i++) cards[i].classList.remove('on');
  document.getElementById('cc-'+id).classList.add('on');
  S.char = null;
  for(var i=0;i<CHARS.length;i++){ if(CHARS[i].id===id){ S.char=CHARS[i]; break; } }
  document.getElementById('preview-text').textContent = '"'+(S.name||'아이')+'아, '+S.char.preview+'"';
  document.getElementById('preview-card').classList.remove('hidden');
  document.getElementById('btn-next').disabled = false;
}

function goCategory(){
  if (!S.char) return;
  document.getElementById('cat-char-wrap').innerHTML = spLg(S.char, 1, 'a-float');
  var lb = document.getElementById('cat-label');
  lb.textContent = S.char.name+'이(가) 말해줄게요!';
  lb.className = 'cat-char-label '+S.char.cls;
  show('s-cat');
}

function pickCat(id){
  S.cat = null;
  for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id){ S.cat=CATS[i]; break; } }
  show('s-msg');
  generate();
}
function regen(){ stopSpeak(); generate(); }

function setMsgChar(pose, anim){
  document.getElementById('msg-sp-wrap').innerHTML = spLg(S.char, pose, anim);
}

function generate(){
  var char=S.char, cat=S.cat, name=S.name, key=S.key;
  setMsgChar(2, 'a-bounce');
  var who = document.getElementById('msg-who');
  who.textContent = char.name+'이(가) 말해줄게요!';
  who.className = 'msg-who '+char.cls;
  g('loading',false); g('bubble',true); g('btn-speak',true); g('btn-regen',true);

  var prompt = char.persona + '\n\n지금 "'+name+'"라는 아이가 '+CTX[cat.id]+' 상황이야.\n'+name+'이(가) 즉시 행동을 바꿀 수 있도록 직접 말해줘.\n[규칙] 반드시 "'+name+'" 이름 1~2번 포함 / 2~3문장 짧고 강렬하게 / 살짝 겁나면서도 따뜻한 느낌 / 사투리 말투 반드시 사용 / 마지막 문장은 구체적 행동 지시 / 대사만 출력';

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data.error) throw new Error(data.error.message);
    S.msg = data.content[0].text.trim();
    g('loading',true);
    setMsgChar(5, 'a-float');
    document.getElementById('msg-text').textContent = S.msg;
    document.getElementById('bubble').className = 'bubble '+char.cls;
    g('bubble',false); g('btn-speak',false); g('btn-regen',false);
    setTimeout(function(){ speakNow(S.msg); }, 500);
  })
  .catch(function(e){
    g('loading',true);
    setMsgChar(4, 'a-float');
    document.getElementById('msg-text').textContent = '⚠️ 오류: '+e.message+'\n\n⚙️ 설정에서 API 키를 확인해주세요.';
    document.getElementById('bubble').className = 'bubble '+char.cls;
    g('bubble',false); g('btn-regen',false);
  });
}

function toggleSpeak(){ S.speaking ? stopSpeak() : speakNow(S.msg); }
function speakNow(text){
  if (!text) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.pitch=S.char.pitch; u.rate=S.char.rate; u.volume=1;
  var voices = speechSynthesis.getVoices();
  for(var i=0;i<voices.length;i++){ if(voices[i].lang.startsWith('ko')){ u.voice=voices[i]; break; } }
  u.onstart = function(){
    S.speaking=true;
    var b=document.getElementById('btn-speak');
    b.textContent='⏹ 멈추기'; b.classList.add('on');
    setMsgChar(0,'a-talk');
  };
  u.onend = u.onerror = function(){ S.speaking=false; resetBtn(); };
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ window.speechSynthesis.cancel(); S.speaking=false; resetBtn(); }
function resetBtn(){
  var b=document.getElementById('btn-speak');
  if(b){ b.textContent='🔊 목소리로 읽어주기'; b.classList.remove('on'); }
  setMsgChar(7,'a-float');
}
function goHome(){
  stopSpeak(); S.char=null; S.cat=null;
  var cards=document.querySelectorAll('.char-card');
  for(var i=0;i<cards.length;i++) cards[i].classList.remove('on');
  document.getElementById('preview-card').classList.add('hidden');
  document.getElementById('btn-next').disabled=true;
  show('s-home');
}
function openSettings(){
  var n=prompt('아이 이름 변경:',S.name); if(n!==null&&n.trim()) S.name=n.trim();
  var k=prompt('API 키 변경 (변경 없으면 빈칸):',''); if(k&&k.trim()) S.key=k.trim();
  save(); setName(); toast('저장되었어요! ✅');
}
function g(id,hide){ document.getElementById(id).classList[hide?'add':'remove']('hidden'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2600); }
speechSynthesis.onvoiceschanged = function(){};
</script>
</body>
</html>
